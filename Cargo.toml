[package]
name = "grok-proxy-cc"
version = "0.1.1"
edition = "2021"
description = "Anthropic Messages API proxy for Grok (xAI) models, for Claude Code"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "signal", "time", "io-util", "net", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-core = "0.3"
bytes = "1.12"
tokio-stream = { version = "0.1", features = ["sync"] }
hyper = { version = "1.12", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
http-body-util = "0.1"
http-body = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
debug = false

[dev-dependencies]
tokio-test = "0.4"
